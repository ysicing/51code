name: Desktop platforms

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
# 只做三平台回归；所有平台的安装包都在维护者的 Mac 上统一构建并发布（scripts/publish-release.mjs）。

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  GOMAXPROCS: '2'
  GOFLAGS: '-p=1'
  CGO_ENABLED: '0'

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            platform: windows-amd64
          - name: Ubuntu x64
            runner: ubuntu-24.04
            platform: linux-amd64
          - name: macOS regression
            runner: macos-15
            platform: darwin-arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Use installed Git safely on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitDirectory = Split-Path (Get-Command git.exe -ErrorAction Stop).Source
          if (-not [IO.Path]::IsPathRooted($gitDirectory)) { throw 'Git PATH must be absolute' }
          $gitDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'NoDefaultCurrentDirectoryInExePath=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Keep checkout and Git fixtures on LF
        run: git config --global core.autocrlf false
      - name: Install Linux runtime and virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git libgtk-3-0t64 libsecret-1-0 fonts-noto-cjk gnome-keyring xvfb xauth dbus-x11 libgl1-mesa-dri libglx-mesa0 libegl-mesa0
      - run: bun install --frozen-lockfile
      - name: Go regression tests (Linux)
        if: runner.os == 'Linux'
        env:
          XSOURCETREE_TEST_SCREENSHOTS: ${{ runner.temp }}/51code-screenshots
        run: |
          # 独立的 CI keyring 只存测试的合成凭证，不接触真实用户密钥。
          xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
            printf "%s" "51code-ci-synthetic-only" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            XSOURCETREE_TEST_KEYCHAIN=1 go test -p=1 -parallel=2 ./...
          '
      - name: Go regression tests (macOS and Windows)
        if: runner.os != 'Linux'
        env:
          XSOURCETREE_TEST_KEYCHAIN: ${{ runner.os == 'Windows' && '1' || '' }}
          XSOURCETREE_TEST_SCREENSHOTS: ${{ runner.temp }}/51code-screenshots
        run: go test -p=1 -parallel=2 ./...
      - name: Keep UI Tester screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.platform }}
          path: ${{ runner.temp }}/51code-screenshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Release script tests
        run: bun test ./scripts
